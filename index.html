<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capi: sua capivara do orçamento</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EFF7EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Capi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFF7EC;--card:#DCEED8;--card2:#F9FDF7;--ink:#33503F;--muted:#6B8774;--acc:#8ED1AA;--accink:#24402F;--warn:#F0C36A;--bad:#E58A82;--line:#C9E0C4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A261F;--card:#25362C;--card2:#2E4235;--ink:#E6F2E8;--muted:#A2B8A8;--acc:#8FD6AE;--accink:#1A261F;--line:#38503F}}
:root[data-theme="dark"]{--bg:#1A261F;--card:#25362C;--card2:#2E4235;--ink:#E6F2E8;--muted:#A2B8A8;--acc:#8FD6AE;--accink:#1A261F;--line:#38503F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;justify-content:space-between;align-items:center}
.month{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:4px}
.month b{min-width:96px;text-align:center;font-weight:600;text-transform:capitalize}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.ib svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:34px;font-weight:800;margin:22px 0 14px;letter-spacing:-.02em}
.bubble{position:relative;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 16px;margin:18px 4px 0;text-align:center;font-size:15px;line-height:1.35}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.gauge{position:relative;margin-top:10px}
.gauge svg.g{width:100%;display:block}
.gauge .arc{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.mas{position:absolute;left:50%;top:24%;width:46%;transform:translateX(-50%)}
.mas svg{width:100%;display:block;overflow:visible}
.mas svg *{transform-box:fill-box}
.mas.pop{animation:pop .5s}
@keyframes pop{40%{transform:translateX(-50%) translateY(-8px) scale(1.04)}}
.bd{transform-origin:50% 100%;animation:br 4s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.015,1.03)}}
.ear{transform-origin:50% 90%;animation:ear 6s infinite}
@keyframes ear{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-14deg)}94%{transform:rotate(8deg)}}
.eye{transform-origin:50% 50%;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.arms{animation:arms 4s ease-in-out infinite}
@keyframes arms{50%{transform:translateY(-1.5px)}}
.m-happy .bd{animation:hop 1.1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:scale(1.04,.94)}40%{transform:translateY(-9px) scale(.97,1.04)}}
.m-sad .bd{animation:sad 3.5s ease-in-out infinite}
@keyframes sad{50%{transform:scale(1.01,.965)}}
.m-angry .bd{animation:shk .35s linear infinite}
@keyframes shk{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.m-surprised .bd{animation:jmp 1.2s ease-in-out infinite}
@keyframes jmp{0%,60%,100%{transform:none}20%{transform:translateY(-12px) scale(.97,1.05)}35%{transform:translateY(0) scale(1.05,.94)}}
.m-sleepy .bd{animation:br 5s ease-in-out infinite}
.z{animation:zz 3s ease-in infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-14px)}}
.tear{animation:tear 2.4s ease-in infinite}
@keyframes tear{0%{opacity:0;transform:translateY(-4px)}20%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
.val{text-align:center;margin-top:-34px}
.val small{display:block;color:var(--muted);font-size:15px}
.val .n{font-size:58px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.val .n i{font-style:normal;font-size:28px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--card);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;margin-top:12px}
.chip s{width:9px;height:9px;border-radius:50%;background:var(--c)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0 18px;text-align:center;font-size:14px}
.acts .ib{width:58px;height:58px;background:var(--card);margin:0 auto 6px}
.card{background:var(--card);border-radius:28px;padding:18px;margin-top:14px}
.card h2{margin:0 0 12px;font-size:16px;font-weight:600;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}
.row+.row{border-top:1px solid var(--line)}
.row .l{display:flex;align-items:center;gap:12px;min-width:0}
.row .l div{min-width:0}
.row b{font-weight:600}
.row .d{color:var(--muted);font-size:13px}
.ic{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.bar i.over{background:var(--bad)}
.pos{color:var(--acc)}
.tot{font-weight:800;font-size:18px}
input,select{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
input.lim{width:92px;text-align:right}
.form{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-top:10px}
.btn{background:var(--ink);color:var(--bg);border-radius:18px;padding:14px;font-weight:600;width:100%}
.btn.sm{padding:10px;border-radius:14px}
.btn.ghost{background:var(--card2);color:var(--ink)}
.x{color:var(--muted);padding:6px 10px}
.empty{text-align:center;color:var(--muted);padding:14px 6px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 32px));background:var(--card2);border-radius:99px;box-shadow:0 6px 24px rgba(0,0,0,.14);display:flex;justify-content:space-between;align-items:center;padding:8px 12px;z-index:10}
.nav button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.nav button.on{background:var(--card);color:var(--ink)}
.nav button.plus{background:var(--ink);color:var(--bg);width:60px;height:60px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:30px 30px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:96vh;overflow:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:99px;padding:4px;margin:12px 0}
.seg button{padding:10px;border-radius:99px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--card2);color:var(--ink)}
.amt{text-align:center;font-size:52px;font-weight:800;letter-spacing:-.03em;margin:8px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chips button{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);width:64px}
.chips button.on .ic{background:var(--acc);color:var(--accink)}
.q{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}
.q button,.keys button{background:var(--card);border-radius:16px;padding:12px;font-weight:600}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.keys button{font-size:24px;padding:14px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moods button{background:var(--card2);border-radius:18px;padding:8px 4px;font-size:12px;color:var(--muted)}
.moods button.on{outline:2px solid var(--acc)}
.moods svg{width:70%;display:block;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var INK="#2A1B10",BODY="#A8713F",SNOUT="#D8AE7E";
var IC={cart:"M3 4h2l2.4 10.5a1 1 0 0 0 1 .8h8.7a1 1 0 0 0 1-.8L20 8H6M9 20h.01M17 20h.01",food:"M6 3v8M9 3v8M6 7h3M7.5 11v10M17 3c-2 2-2.500 5-2.500 8H17v10",car:"M5 16l1.500-5.500A2 2 0 0 1 8.400 9h7.200a2 2 0 0 1 1.900 1.500L19 16M4 16h16v3H4zM7 19v1.500M17 19v1.500",party:"M4 20l4-12 8 8-12 4zM14 4l.5 2M19 8l-2 .5M17 3l-1 1.500",heart:"M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z",home:"M4 11l8-7 8 7v9h-5v-6H9v6H4z",list:"M7 3h10v18l-2-1.500-1.500 1.500-1.500-1.500-1.500 1.500-1.500-1.500L7 21zM10 8h4M10 12h4",pie:"M12 3a9 9 0 1 0 9 9h-9zM15 3.500A9 9 0 0 1 20.500 9H15z",set:"M4 8h9M17 8h3M4 16h3M11 16h9M15 6v4M9 14v4",plus:"M12 5v14M5 12h14",minus:"M5 12h14",repeat:"M4 11V9a3 3 0 0 1 3-3h11l-3-3M20 13v2a3 3 0 0 1-3 3H6l3 3",gauge:"M5 18a8 8 0 1 1 14 0M12 14l4-5",left:"M15 5l-7 7 7 7",right:"M9 5l7 7-7 7",coin:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9 12h6"};
var CATS=[["mer","Mercado e alimentação","cart",400],["res","Restaurantes e delivery","food",200],["tra","Transporte","car",200],["laz","Lazer, compras e pessoal","party",100],["sau","Saúde","heart",80]];
var NAMES={happy:"Feliz",neutral:"Tranquila",surprised:"Surpresa",angry:"Brava",sad:"Triste",sleepy:"Sonolenta"};
function icon(n){return '<svg viewBox="0 0 24 24"><path d="'+IC[n]+'"/></svg>'}
function mascotOld(m){
 var e="";var st='stroke="'+INK+'" stroke-width="5" stroke-linecap="round" fill="none"';
 var dots='<circle cx="72" cy="72" r="5.500" fill="'+INK+'"/><circle cx="128" cy="72" r="5.500" fill="'+INK+'"/>';
 if(m=="happy")e='<path d="M60 74q12-14 24 0M116 74q12-14 24 0" '+st+'/>';
 else if(m=="neutral")e=dots;
 else if(m=="surprised")e='<circle cx="72" cy="70" r="10" fill="#fff"/><circle cx="128" cy="70" r="10" fill="#fff"/><circle cx="72" cy="70" r="4.500" fill="'+INK+'"/><circle cx="128" cy="70" r="4.500" fill="'+INK+'"/>';
 else if(m=="sad")e=dots+'<path d="M58 60l26-8M142 60l-26-8" '+st+'/><path d="M80 82q-4 7 0 10 4-3 0-10z" fill="#6EB4E8"/>';
 else if(m=="angry")e=dots+'<path d="M58 50l26 12M142 50l-26 12" '+st+'/>';
 else e='<path d="M60 72h24M116 72h24" '+st+'/><path d="M150 38h12l-12 12h12" stroke="'+INK+'" stroke-width="3" fill="none" stroke-linecap="round"/>';
 return '<svg viewBox="0 0 200 150" role="img" aria-label="Capi, a capivara, '+NAMES[m].toLowerCase()+'"><circle cx="56" cy="38" r="13" fill="'+BODY+'"/><circle cx="144" cy="38" r="13" fill="'+BODY+'"/><circle cx="56" cy="40" r="6" fill="#7A4D26"/><circle cx="144" cy="40" r="6" fill="#7A4D26"/><path d="M28 84C28 44 68 30 100 30s72 14 72 54c0 38-30 54-72 54S28 122 28 84z" fill="'+BODY+'"/><ellipse cx="100" cy="112" rx="40" ry="23" fill="'+SNOUT+'"/><ellipse cx="88" cy="106" rx="4" ry="5.500" fill="'+INK+'"/><ellipse cx="112" cy="106" rx="4" ry="5.500" fill="'+INK+'"/>'+e+'</svg>';
}
function mascot(m){
 var O="#5A2E22",E="#2B1A14",TAN="#E2B27C",SN="#A87355",EAR="#8B5E4B";
 var ln='stroke="'+O+'" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"';
 var ms='stroke="'+O+'" stroke-width="2.4" stroke-linecap="round" fill="none"';
 var es='stroke="'+E+'" stroke-width="5" stroke-linecap="round" fill="none"';
 var eye,mouth,extra="";
 var nose='<path d="M120 61l5 3M136 61l-5 3" '+ms+'/><path d="M128 64v14" '+ms+'/>';
 if(m=="happy"){eye='<path class="eye" d="M74 61q10-11 20 0" '+es+'/>';mouth='<path d="M122 80q6 6 12 0" '+ms+'/>'}
 else if(m=="sad"){eye='<path class="eye" d="M74 57q10 8 20 0" '+es+'/><path d="M72 49L96 42" '+ms+'/>';mouth='<path d="M122 87q6-7 12 0" '+ms+'/>';extra='<path class="tear" d="M90 68q-4 7 0 10 4-3 0-10z" fill="#8CC8F0"/>'}
 else if(m=="angry"){eye='<path class="eye" d="M72 53l24 9" '+es+'/>';mouth='<path d="M122 86q6-5 12 0" '+ms+'/>';nose='<path d="M119 59l7 5M137 59l-7 5" '+ms+'/><path d="M128 64v14" '+ms+'/>'}
 else if(m=="surprised"){eye='<g class="eye"><circle cx="84" cy="58" r="9" fill="#fff" stroke="'+O+'" stroke-width="2.5"/><circle cx="86" cy="58" r="3.800" fill="'+E+'"/></g>';mouth='<ellipse cx="128" cy="84" rx="3.500" ry="4.500" fill="'+O+'"/>'}
 else if(m=="sleepy"){eye='<path d="M74 59q10 5 20 0" '+es+'/>';mouth='<path d="M124 83h8" '+ms+'/>';extra='<g class="z"><path d="M158 54h9l-9 10h9" stroke="'+O+'" stroke-width="2.600" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>'}
 else{eye='<rect class="eye" x="73" y="55.500" width="22" height="5.500" rx="2.700" fill="'+E+'"/>';mouth='<path d="M123 83q5-4 10 0" '+ms+'/>'}
 return '<svg viewBox="0 0 200 184" class="m-'+m+'" role="img" aria-label="Capi, a capivara, '+NAMES[m].toLowerCase()+'"><ellipse cx="100" cy="177" rx="82" ry="7" fill="#000" opacity=".08"/><g class="bd"><g class="ear"><circle cx="46" cy="42" r="13" fill="'+EAR+'" '+ln+'/></g><g class="ear" style="animation-delay:-2s"><circle cx="148" cy="25" r="9" fill="'+EAR+'" '+ln+'/></g><path d="M100 20C138 18 166 44 172 80C177 108 182 140 160 160C146 172 54 172 40 160C18 140 24 108 30 76C36 44 62 22 100 20Z" fill="'+TAN+'" '+ln+'/><path d="M38 142C60 168 140 168 164 142C168 158 154 170 100 171C46 171 34 158 38 142Z" fill="#C99A68" opacity=".6"/><path d="M62 30l-6-4M73 26l-3-6M85 23l-1-6" '+ms+'/><ellipse cx="72" cy="74" rx="12" ry="8" fill="#F2A090" opacity=".55"/><rect x="106" y="46" width="44" height="54" rx="22" fill="'+SN+'"/>'+nose+mouth+eye+extra+'<g class="arms"><path d="M62 110Q84 104 104 119" '+ms+'/><ellipse cx="101" cy="123" rx="16" ry="10" fill="'+SN+'" '+ln+'/><ellipse cx="124" cy="119" rx="12" ry="10" fill="'+SN+'" '+ln+'/><path d="M94 129l-2 4M101 131v4M108 129l2 4" '+ms+'/></g><ellipse cx="68" cy="170" rx="21" ry="9" fill="#6E4A3C" '+ln+'/><ellipse cx="142" cy="169" rx="19" ry="9" fill="#6E4A3C" '+ln+'/></g></svg>';
}
var S,V={y:0,m:0,tab:"home",sheet:null,msg:null,pm:"happy",lastMood:""};
var now=new Date();V.y=now.getFullYear();V.m=now.getMonth();
function load(){try{var r=localStorage.getItem("capi-v1");if(r)return JSON.parse(r)}catch(e){}var l={};CATS.forEach(function(c){l[c[0]]=c[3]});return{lim:l,tx:[],fx:[]}}
function save(){try{localStorage.setItem("capi-v1",JSON.stringify(S))}catch(e){}}
S=load();
function brl(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function brl0(n){return "R$ "+Math.round(n).toLocaleString("pt-BR")}
function ym(){return V.y+"-"+String(V.m+1).padStart(2,"0")}
function curMonth(){return V.y==now.getFullYear()&&V.m==now.getMonth()}
function calc(){
 var k=ym(),c={},sp=0,inc=0;
 CATS.forEach(function(x){c[x[0]]=0});
 S.tx.forEach(function(t){if(t.d.slice(0,7)!=k)return;if(t.t=="r")inc+=t.a;else{sp+=t.a;c[t.c]=(c[t.c]||0)+t.a}});
 var L=0;CATS.forEach(function(x){L+=+S.lim[x[0]]||0});
 var fi=0,fo=0;S.fx.forEach(function(f){if(f.t=="r")fi+=f.a;else fo+=f.a});
 return{c:c,sp:sp,inc:inc,L:L,fi:fi,fo:fo,rem:L-sp};
}
function mood(a){
 var over=CATS.filter(function(x){return a.c[x[0]]>(+S.lim[x[0]]||0)&&S.lim[x[0]]>0});
 if(a.L>0&&a.rem<0)return["sad","Passou "+brl(-a.rem)+" do limite. Vou fingir que não vi. Mentira, vi sim."];
 if(over.length)return["angry",over[0][1]+" estourou. Eu vi. Eu sempre vejo."];
 if(a.L>0&&a.sp/a.L>=.8)return["surprised","Já foi "+Math.round(a.sp/a.L*100)+"% do limite. Segura a onda, ainda tem mês pela frente."];
 if(curMonth()&&now.getHours()<6)return["sleepy","Zzz… gastando às "+now.getHours()+"h? Vai dormir, a conta espera."];
 if(a.sp==0)return["happy","Mês zerado e limite cheio. Vamos manter assim?"];
 return["neutral","Tudo sob controle. Estou de olho, mas sem julgar. Muito."];
}
function daysLeft(){var dim=new Date(V.y,V.m+1,0).getDate();return curMonth()?dim-now.getDate()+1:dim}
function head(title){
 var nm=new Date(V.y,V.m,1).toLocaleDateString("pt-BR",{month:"long"})+(V.y!=now.getFullYear()?" "+V.y:"");
 return '<div class="top"><div class="month"><button class="ib" data-a="prev" aria-label="Mês anterior">'+icon("left")+'</button><b>'+nm+'</b><button class="ib" data-a="next" aria-label="Próximo mês">'+icon("right")+'</button></div></div>'+(title?'<h1>'+title+'</h1>':'');
}
function catRow(x,a,edit){
 var lim=+S.lim[x[0]]||0,s=a.c[x[0]]||0,p=lim?Math.min(100,s/lim*100):0;
 return '<div class="row"><div class="l"><span class="ic">'+icon(x[2])+'</span><div><b>'+x[1]+'</b><div class="d">'+brl0(s)+' de '+brl0(lim)+' este mês</div><div class="bar"><i class="'+(s>lim?"over":"")+'" style="width:'+p+'%"></i></div></div></div>'+(edit?'<input class="lim" type="number" inputmode="decimal" min="0" data-lim="'+x[0]+'" value="'+lim+'" aria-label="Limite de '+x[1]+'">':'')+'</div>';
}
function fxRows(){
 return S.fx.map(function(f){var paid=f.p&&f.p[ym()];
  return '<div class="row"><div class="l"><button class="ic" data-a="pay" data-v="'+f.i+'" aria-label="Marcar como pago">'+icon(paid?"coin":(f.t=="r"?"plus":"minus"))+'</button><div><b>'+f.n+'</b><div class="d">'+(paid?(f.t=="r"?"recebido":"pago"):(f.t=="r"?"a receber":"a pagar"))+'</div></div></div><b class="'+(f.t=="r"?"pos":"")+'">'+(f.t=="r"?"+":"−")+brl(f.a)+'</b></div>'}).join("");
}
function home(){
 var a=calc(),mo=mood(a),m=mo[0],txt=V.msg||mo[1],pct=a.L>0?Math.max(0,Math.min(1,a.rem/a.L)):0;
 if(V.msg)m=V.msgMood||m;
 var col=a.rem<0?"var(--bad)":pct<.25&&a.L>0?"var(--warn)":"var(--acc)";
 var p=Math.abs(a.rem).toFixed(2).split("."),ip=(+p[0]).toLocaleString("pt-BR");
 var pace=a.rem<0?"Acima do limite":(curMonth()&&a.L>0&&a.sp/a.L>now.getDate()/new Date(V.y,V.m+1,0).getDate()*1.15?"Acelerado":"No ritmo");
 var pop=V.lastMood!=m?" pop":"";V.lastMood=m;
 var fp=S.fx.filter(function(f){return f.p&&f.p[ym()]}).length;
 var fxm=S.fx.reduce(function(s,f){return s+(f.t=="d"?f.a:0)},0);
 return head()+'<div class="bubble" role="status">'+txt+'</div><div class="gauge"><svg class="g" viewBox="0 0 300 215" aria-hidden="true"><path d="M50.400 197.500A115 115 0 1 1 249.600 197.500" pathLength="100" fill="none" stroke="var(--card)" stroke-width="16" stroke-linecap="round"/><path class="arc" d="M50.400 197.500A115 115 0 1 1 249.600 197.500" pathLength="100" fill="none" stroke="'+col+'" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+(pct*100)+' 100"/></svg><div class="mas'+pop+'">'+mascot(m)+'</div></div>'+
 '<div class="val"><small>'+(a.rem<0?"Passou do limite":"Pode gastar")+'</small><div class="n">'+(a.rem<0?"−":"")+'R$ '+ip+'<i>,'+p[1]+'</i></div><div class="sub">de '+brl0(a.L)+' · '+daysLeft()+' dias</div><span class="chip" style="--c:'+col+'"><s></s>'+pace+'</span></div>'+
 '<div class="acts"><button data-a="add" data-v="g"><span class="ib">'+icon("minus")+'</span>Gasto</button><button data-a="add" data-v="r"><span class="ib">'+icon("plus")+'</span>Receita</button><button data-a="tab" data-v="set"><span class="ib">'+icon("repeat")+'</span>Fixos</button><button data-a="tab" data-v="lim"><span class="ib">'+icon("gauge")+'</span>Limites</button></div>'+
 '<div class="card"><h2>O mês em uma conta</h2><div class="row"><span>Receitas</span><b class="pos">+'+brl(a.inc+a.fi)+'</b></div><div class="row"><span>Fixos</span><b>−'+brl(a.fo)+'</b></div><div class="row"><span>Gastos do dia a dia</span><b>−'+brl(a.sp)+'</b></div><div class="row"><span>Sobra</span><b class="tot">'+brl(a.inc+a.fi-a.fo-a.sp)+'</b></div></div>'+
 (S.fx.length?'<div class="card"><h2>Fixos do mês ('+fp+' de '+S.fx.length+')</h2>'+fxRows()+'</div>':'');
}
function list(){
 var k=ym(),t=S.tx.filter(function(x){return x.d.slice(0,7)==k}).sort(function(a,b){return b.d<a.d?-1:b.d>a.d?1:b.i-a.i});
 var rows=t.map(function(x){var c=CATS.filter(function(y){return y[0]==x.c})[0];
  return '<div class="row"><div class="l"><span class="ic">'+icon(x.t=="r"?"plus":c?c[2]:"coin")+'</span><div><b>'+(x.t=="r"?"Receita":c?c[1]:"Gasto")+'</b><div class="d">'+x.d.split("-").reverse().slice(0,2).join("/")+'</div></div></div><div><b class="'+(x.t=="r"?"pos":"")+'">'+(x.t=="r"?"+":"−")+brl(x.a)+'</b><button class="x" data-a="del" data-v="'+x.i+'" aria-label="Apagar lançamento">×</button></div></div>'}).join("");
 return head("Lançamentos")+'<div class="card">'+(rows||'<div class="empty"><b>Nada por aqui</b>Toque no + para anotar o primeiro gasto.</div>')+'</div>';
}
function lim(){
 var a=calc();
 return head("Limites")+'<div class="card"><h2>Limites do dia a dia</h2><div class="row"><div class="l"><span class="ic">'+icon("gauge")+'</span><div><b>Limite do mês</b><div class="d">soma dos limites por categoria</div></div></div><b class="tot">'+brl(a.L)+'</b></div>'+CATS.map(function(x){return catRow(x,a,true)}).join("")+'<div class="d" style="margin-top:10px;color:var(--muted);font-size:13px">Fixos não entram aqui. O limite vale para gastos do dia a dia.</div></div>';
}
function settings(){
 var mh=Object.keys(NAMES).map(function(k){return '<button data-a="pm" data-v="'+k+'" class="'+(V.pm==k?"on":"")+'">'+mascot(k)+NAMES[k]+'</button>'}).join("");
 return head("Ajustes")+'<div class="card" id="fx"><h2>Fixos e salário</h2>'+(fxRows()||'<div class="empty"><b>Nada cadastrado</b>Comece pelo salário e pelo aluguel. Eles aparecem todo mês no Início para você marcar como pago.</div>')+
 '<div class="form"><input id="fn" placeholder="Nome (ex.: Aluguel)" aria-label="Nome do fixo"><input id="fa" type="number" inputmode="decimal" min="0" placeholder="Valor" aria-label="Valor"><select id="ft" aria-label="Tipo"><option value="d">Sai</option><option value="r">Entra</option></select><button class="btn sm" data-a="addfx">Adicionar</button></div>'+
 (S.fx.length?'<button class="x" data-a="clrfx" style="margin-top:8px">Apagar todos os fixos</button>':'')+'</div>'+
 '<div class="card"><h2>Como a Capi reage</h2><div class="moods">'+mh+'</div><div class="bubble" style="margin-top:20px">'+previewMsg(V.pm)+'</div></div>'+
 '<div class="card"><h2>Instalar no celular</h2><p style="margin:0;color:var(--muted);line-height:1.45">No navegador, toque em Compartilhar, depois em Adicionar à Tela de Início. Seus dados ficam só neste aparelho.</p></div>'+
 '<div class="card"><button class="btn ghost" data-a="reset">Apagar todos os dados</button></div>';
}
function previewMsg(m){return{happy:"Mês zerado e limite cheio. Vamos manter assim?",neutral:"Tudo sob controle. Estou de olho, mas sem julgar. Muito.",surprised:"R$ 450?! De uma vez só?",angry:"Mercado estourou. Eu vi. Eu sempre vejo.",sad:"Passou do limite. Vou fingir que não vi. Mentira, vi sim.",sleepy:"Zzz… gastando às 3h? Vai dormir."}[m]}
function sheet(){
 var s=V.sheet,a=calc(),g=s.t=="g";
 var chips=g?'<div class="chips" role="group" aria-label="Categoria">'+CATS.map(function(x){return '<button data-a="cat" data-v="'+x[0]+'" class="'+(s.c==x[0]?"on":"")+'"><span class="ic">'+icon(x[2])+'</span>'+x[1].split(" ")[0].replace(",","")+'</button>'}).join("")+'</div>':'<div style="height:12px"></div>';
 return '<div class="shade" data-a="shade"><div class="sheet" role="dialog" aria-label="Novo lançamento"><div class="top"><h1 style="margin:0;font-size:26px">Novo lançamento</h1><button class="ib" style="background:var(--card)" data-a="close" aria-label="Fechar">×</button></div><div class="seg"><button class="'+(g?"on":"")+'" data-a="st" data-v="g">Gasto</button><button class="'+(!g?"on":"")+'" data-a="st" data-v="r">Receita</button></div><div class="amt">'+brl(s.v/100)+'</div><div class="sub" style="text-align:center">'+(g?'Pode gastar no mês: <b>'+brl0(a.rem)+'</b>':'Entra no saldo do mês')+'</div>'+chips+'<div class="q">'+[10,20,50,100].map(function(n){return '<button data-a="quick" data-v="'+n+'">+'+n+'</button>'}).join("")+'</div><div class="keys">'+[1,2,3,4,5,6,7,8,9,"00",0,"⌫"].map(function(k){return '<button data-a="key" data-v="'+k+'" aria-label="'+(k=="⌫"?"Apagar":k)+'">'+k+'</button>'}).join("")+'</div><button class="btn" data-a="save">Continuar</button></div></div>';
}
function render(){
 var h=V.tab=="home"?home():V.tab=="list"?list():V.tab=="lim"?lim():settings();
 var tabs=[["home","home","Início"],["list","list","Lançamentos"],["add","plus","Novo lançamento"],["lim","pie","Limites"],["set","set","Ajustes"]];
 var nav='<nav class="nav" aria-label="Principal">'+tabs.map(function(t){return t[0]=="add"?'<button class="plus" data-a="add" data-v="g" aria-label="'+t[2]+'">'+icon(t[1])+'</button>':'<button data-a="tab" data-v="'+t[0]+'" class="'+(V.tab==t[0]?"on":"")+'" aria-label="'+t[2]+'">'+icon(t[1])+'</button>'}).join("")+'</nav>';
 var f=document.activeElement&&document.activeElement.id;
 document.getElementById("app").innerHTML=h+nav+(V.sheet?sheet():"");
 if(f){var el=document.getElementById(f);if(el)el.focus()}
}
function uid(){return Date.now()+Math.floor(Math.random()*1000)}
function react(t,amt,cat){
 var a=calc();V.msgMood=null;
 if(t=="r"){V.msg="Entrou "+brl(amt)+". Agora é não gastar tudo de uma vez.";V.msgMood="happy";return}
 var c=CATS.filter(function(x){return x[0]==cat})[0],lim=+S.lim[cat]||0;
 if(a.L>0&&amt>=a.L*.3){V.msg=brl0(amt)+"?! De uma vez só?";V.msgMood="surprised"}
 else if(lim>0&&a.c[cat]>lim){V.msg=c[1]+" estourou. Eu avisei. Tá, não avisei, mas pensei.";V.msgMood="angry"}
 else{V.msg="Anotado em "+c[1].split(" ")[0].replace(",","")+": sobram "+brl0(Math.max(0,lim-a.c[cat]))+".";V.msgMood=null}
}
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-a]");if(!b)return;
 var a=b.dataset.a,v=b.dataset.v,s=V.sheet;
 if(a=="shade"&&e.target!==b)return;
 if(a=="tab"){V.tab=v;V.msg=null;V.sheet=null;window.scrollTo(0,0)}
 else if(a=="prev"||a=="next"){V.m+=a=="next"?1:-1;if(V.m<0){V.m=11;V.y--}if(V.m>11){V.m=0;V.y++}V.msg=null}
 else if(a=="add"){V.sheet={t:v,v:0,c:"mer"}}
 else if(a=="close"||a=="shade")V.sheet=null;
 else if(a=="st")s.t=v;
 else if(a=="cat")s.c=v;
 else if(a=="quick")s.v+=v*100;
 else if(a=="key"){if(v=="⌫")s.v=Math.floor(s.v/10);else{var n=s.v*Math.pow(10,v.length)+ +v;if(n<=99999999)s.v=n}}
 else if(a=="save"){if(s.v<=0)return;var d=new Date(),ds=(curMonth()?d:new Date(V.y,V.m,1));var iso=ds.getFullYear()+"-"+String(ds.getMonth()+1).padStart(2,"0")+"-"+String(ds.getDate()).padStart(2,"0");
  var amt=s.v/100;S.tx.push({i:uid(),t:s.t=="g"?"g":"r",a:amt,c:s.t=="g"?s.c:"",d:iso});save();react(s.t=="g"?"g":"r",amt,s.c);V.sheet=null;V.tab="home";window.scrollTo(0,0)}
 else if(a=="del"){S.tx=S.tx.filter(function(x){return x.i!=v});save()}
 else if(a=="pay"){S.fx.forEach(function(f){if(f.i==v){f.p=f.p||{};f.p[ym()]=!f.p[ym()]}});save()}
 else if(a=="addfx"){var n=document.getElementById("fn").value.trim(),am=parseFloat(document.getElementById("fa").value);if(!n||!(am>0))return;S.fx.push({i:uid(),n:n,a:am,t:document.getElementById("ft").value,p:{}});save()}
 else if(a=="clrfx"){S.fx=[];save()}
 else if(a=="pm")V.pm=v;
 else if(a=="reset"){if(!window.confirm("Apagar todos os lançamentos, limites e fixos deste aparelho?"))return;try{localStorage.removeItem("capi-v1")}catch(x){}S=load();V.msg=null}
 render();
});
document.addEventListener("change",function(e){
 var k=e.target.dataset&&e.target.dataset.lim;if(!k)return;
 S.lim[k]=Math.max(0,parseFloat(e.target.value)||0);save();render();
});
render();
</script>
</body>
</html>
